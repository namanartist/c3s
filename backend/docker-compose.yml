services:
  postgres:
    image: postgres:16-alpine
    container_name: c3s-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: c3s_db
      POSTGRES_USER: c3s_admin
      POSTGRES_PASSWORD: c3s_secure_password_2026
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c3s_admin -d c3s_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: c3s-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  c3s-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c3s-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/c3s_db
      DATABASE_USERNAME: c3s_admin
      DATABASE_PASSWORD: c3s_secure_password_2026
      REDIS_URL: redis://redis:6379
      JWT_SECRET: C3S_CAMPUS_SURVEILLANCE_SECURITY_JWT_SUPER_SECRET_KEY_2026_MITS
      APP_TIMEZONE: Asia/Kolkata
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
