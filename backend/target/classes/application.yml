server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: c3s-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/c3s_db}
    username: ${DATABASE_USERNAME:c3s_user}
    password: ${DATABASE_PASSWORD:c3s_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  timezone: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET:c3s_super_secure_enterprise_grade_jwt_signing_key_2026_at_least_256_bits_long_secure}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  qr:
    secret: ${QR_SIGNING_SECRET:c3s_daily_qr_cryptographic_hmac_secret_key_2026_mits}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./storage/evidence}
  retention:
    location-days: ${RETENTION_LOCATION_DAYS:30}
    audit-days: ${RETENTION_AUDIT_DAYS:365}
    movement-days: ${RETENTION_MOVEMENT_DAYS:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method