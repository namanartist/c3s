    <!-- Immediate RFC4122 v4 polyfill for non-secure HTTP contexts (e.g. LAN IP hosting http://192.168.x.x) -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        function createSafeUUID() {
          if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
            try {
              var bytes = new Uint8Array(16);
              window.crypto.getRandomValues(bytes);
              bytes[6] = (bytes[6] & 0x0f) | 0x40; // Version 4
              bytes[8] = (bytes[8] & 0x3f) | 0x80; // Variant RFC4122
              var hex = [];
              for (var i = 0; i < 16; i++) {
                hex.push((bytes[i] < 16 ? '0' : '') + bytes[i].toString(16));
              }
              return (
                hex.slice(0, 4).join('') + '-' +
                hex.slice(4, 6).join('') + '-' +
                hex.slice(6, 8).join('') + '-' +
                hex.slice(8, 10).join('') + '-' +
                hex.slice(10, 16).join('')
              );
            } catch (e) {}
          }
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = (Math.random() * 16) | 0;
            var v = c === 'x' ? r : (r & 0x3) | 0x8;
            return v.toString(16);
          });
        }

        var targetGlobal = typeof globalThis !== 'undefined' ? globalThis : typeof window !== 'undefined' ? window : this;
        if (!targetGlobal) return;

        // 1. Prototype of crypto instance
        try {
          if (targetGlobal.crypto) {
            var proto = Object.getPrototypeOf(targetGlobal.crypto);
            if (proto && typeof proto.randomUUID !== 'function') {

                  value: createSafeUUID,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              } catch (e1) {
                proto.randomUUID = createSafeUUID;
              }
            }
          }
        } catch (e) {}

        // 2. WebIDL Crypto interface prototype
        try {
          if (typeof targetGlobal.Crypto !== 'undefined' && targetGlobal.Crypto.prototype) {
            if (typeof targetGlobal.Crypto.prototype.randomUUID !== 'function') {
              try {
                Object.defineProperty(targetGlobal.Crypto.prototype, 'randomUUID', {
                  value: createSafeUUID,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {
                targetGlobal.Crypto.prototype.randomUUID = createSafeUUID;
              }
            }
          }
        } catch (e) {}

        // 3. Instance level property definition
        try {
          if (targetGlobal.crypto && typeof targetGlobal.crypto.randomUUID !== 'function') {
            try {
              Object.defineProperty(targetGlobal.crypto, 'randomUUID', {
                value: createSafeUUID,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e3) {
              targetGlobal.crypto.randomUUID = createSafeUUID;
            }
          }
        } catch (e) {}

        // 4. Fallback if crypto object is completely missing
        try {
          if (!targetGlobal.crypto) {
            targetGlobal.crypto = {
              randomUUID: createSafeUUID,
              getRandomValues: function(arr) {
                for (var i = 0; i < arr.length; i++) {
                  arr[i] = Math.floor(Math.random() * 256);
                }
                return arr;
              }
            };
          }
        } catch (e) {}
      })();
    </script>
