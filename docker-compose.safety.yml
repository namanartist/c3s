services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: c3s_safety
      MYSQL_USER: c3s
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: root-change-me
    ports:
      - "3306:3306"
    volumes:
      - c3s-mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot-change-me" ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  c3s-mysql:
